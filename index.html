<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zoeye Wallpaper Builder - Y2K</title>
  <style>
    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', 'MS Gothic', 'Pixelated MS Sans Serif', monospace;
      background: #FF00FF;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      /* Retro Y2K background pattern */
      background-image:
        radial-gradient(circle, rgba(255,255,255,0.08) 1px, transparent 1px);
      background-size: 16px 16px;
    }

    /* ===== Windows 98 Main Window ===== */
    .win98-window {
      width: 100%;
      max-width: 820px;
      border: 2px solid;
      border-color: #FFFFFF #808080 #808080 #FFFFFF;
      box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
      background: #C0C0C0;
      font-size: 14px;
    }

    /* Title Bar */
    .win98-titlebar {
      background: linear-gradient(90deg, #000080, #1084D0);
      color: #FFFFFF;
      padding: 4px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 0.5px;
      user-select: none;
    }

    .win98-titlebar .title-text {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .win98-titlebar .title-text::before {
      content: "🖼";
      font-size: 15px;
    }

    .win98-titlebar .win98-buttons {
      display: flex;
      gap: 2px;
    }

    .win98-titlebar .win98-buttons button {
      width: 18px;
      height: 18px;
      font-size: 11px;
      line-height: 1;
      text-align: center;
      background: #C0C0C0;
      border: 1px solid;
      border-color: #FFFFFF #808080 #808080 #FFFFFF;
      cursor: pointer;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #000;
    }

    .win98-titlebar .win98-buttons button:active {
      border-color: #808080 #FFFFFF #FFFFFF #808080;
    }

    .win98-titlebar .win98-buttons .btn-close {
      background: #C0C0C0;
      color: #000;
      font-size: 12px;
    }

    /* Menu Bar */
    .win98-menubar {
      background: #C0C0C0;
      padding: 2px 4px;
      border-bottom: 1px solid #808080;
      display: flex;
      gap: 2px;
    }

    .win98-menubar span {
      padding: 2px 6px;
      font-size: 12px;
      cursor: pointer;
    }

    .win98-menubar span:hover {
      background: #000080;
      color: #FFFFFF;
    }

    /* ===== Main Content Area ===== */
    .win98-content {
      display: flex;
      flex-direction: row;
      gap: 0;
      padding: 10px;
      background: #C0C0C0;
      min-height: 400px;
    }

    /* ===== Left Sidebar ===== */
    .sidebar {
      width: 200px;
      min-width: 200px;
      background: #FFFFFF;
      border: 2px inset #808080;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-title {
      font-size: 11px;
      font-weight: bold;
      color: #000080;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding-bottom: 4px;
      border-bottom: 1px solid #C0C0C0;
    }

    .sidebar-asset-hint {
      font-size: 11px;
      color: #808080;
      text-align: center;
      padding: 20px 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .sidebar-asset-hint .hint-icon {
      font-size: 28px;
      opacity: 0.5;
    }

    /* ===== Right Canvas Area ===== */
    .canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 10px;
    }

    #wallpaper-canvas {
      width: 375px;
      height: 667px;
      background: #000000;
      border: 2px solid;
      border-color: #808080 #FFFFFF #FFFFFF #808080;
      position: relative;
      overflow: hidden;
      cursor: crosshair;
      /* This canvas is the sticker drop zone */
    }

    /* Inner pixel grid hint (optional subtle effect) */
    .canvas-pixel-hint {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 10px 10px;
      pointer-events: none;
    }

    /* ===== Status Bar ===== */
    .win98-statusbar {
      background: #C0C0C0;
      border-top: 1px solid #808080;
      border-bottom: 2px solid;
      border-color: #FFFFFF #808080 #808080 #FFFFFF;
      padding: 3px 8px;
      font-size: 11px;
      color: #444;
      display: flex;
      justify-content: space-between;
    }

    .win98-statusbar .status-left {
      display: flex;
      gap: 12px;
    }

    .win98-statusbar .status-right {
      color: #000080;
    }

    /* ===== Responsive ===== */
    @media (max-width: 720px) {
      body { padding: 10px; }

      .win98-content {
        flex-direction: column;
        align-items: center;
      }

      .sidebar {
        width: 100%;
        min-width: unset;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        padding: 6px;
        margin-bottom: 8px;
        min-height: 60px;
      }

      .sidebar-title {
        width: 100%;
        text-align: center;
      }

      .sidebar-asset-hint {
        padding: 8px 0;
      }

      .canvas-wrapper {
        padding: 0;
        width: 100%;
      }

      #wallpaper-canvas {
        width: 100%;
        max-width: 375px;
        height: auto;
        aspect-ratio: 375 / 667;
      }
    }

    /* ===== Scrollbar (Win98 style) ===== */
    ::-webkit-scrollbar {
      width: 16px;
    }
    ::-webkit-scrollbar-track {
      background: #C0C0C0;
      border: 1px inset #808080;
    }
    ::-webkit-scrollbar-thumb {
      background: #C0C0C0;
      border: 1px solid;
      border-color: #FFFFFF #808080 #808080 #FFFFFF;
    }
  </style>
</head>
